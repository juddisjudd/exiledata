name: Update

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and republish both games even if the patch has not changed
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: update

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DATASET_STORAGE_DRIVER: r2
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      GGPK_EXPLORER_VERSION: v1.14.2
      DAT_SCHEMA: /tmp/schema.min.json
      FORCE: ${{ inputs.force && '--force' || '' }}
    steps:
      # GitHub disables schedules in public repos after 60 days without commits; enabling resets that clock.
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The CLI runs against the built workspace packages.
      - name: Build the CLI
        run: pnpm --filter "@exiledata/cli..." build

      - id: check
        run: pnpm exiledata update --check $FORCE

      - name: Install ggpk-explorer and the dat schema
        if: steps.check.outputs.stale != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GGPK_EXPLORER_VERSION" -R juddisjudd/ggpk-explorer -D /tmp/ggpk -p "*linux-x64.deb" -p SHA256SUMS.txt
          (cd /tmp/ggpk && grep linux-x64.deb SHA256SUMS.txt | sha256sum -c -)
          sudo apt-get install -y /tmp/ggpk/*.deb
          curl -fsSL -o "$DAT_SCHEMA" https://github.com/poe-tool-dev/dat-schema/releases/latest/download/schema.min.json

      - name: Update
        if: steps.check.outputs.stale != ''
        run: pnpm exiledata update ${{ steps.check.outputs.stale }} $FORCE
