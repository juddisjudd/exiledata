services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: exiledata
      POSTGRES_PASSWORD: exiledata
      POSTGRES_DB: exiledata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exiledata"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
